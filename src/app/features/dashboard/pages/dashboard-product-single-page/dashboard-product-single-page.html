<div class="product-detail">
    @if(product()!){
        <p-card>
          <div class="product-detail__container">
      
            <!-- Imagen -->
            <div class="product-detail__image">

                <img [src]="product()!.image" 
                [alt]="product()!.title" (load)="isLoaded()" [class.img__none]="!loaded()"/>
                @if(!loaded()){
                    <p-skeleton width="100%" height="250px"></p-skeleton>
                }
            </div>
            
            <!-- Info -->
            <div class="product-detail__info">
      
              <h2 class="title">{{ product()!.title }}</h2>
      
              <!-- Rating -->
              <div class="rating">
                <div class="stars">
                  <div 
                    class="stars-filled"
                    [style.width.%]="(product()!.rating.rate / 5) * 100">
                    ★★★★★
                  </div>
                  <div class="stars-empty">★★★★★</div>
                </div>
                <span>{{ product()!.rating.rate }} ({{ product()!.rating.count }} reviews)</span>
              </div>
      
              <!-- Precio -->
              <div class="price">
                ${{ product()!.price }}
              </div>
      
              <!-- Categoría -->
              <p-tag 
                [value]="product()!.category | titlecase" 
                severity="info">
              </p-tag>
      
              <!-- Descripción -->
              <p class="description">
                {{ product()!.description }}
              </p>
      
            </div>
      
          </div>
        </p-card>
    }

</div>
